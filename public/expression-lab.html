<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>玛修 · 表情图谱实验室</title>
    <link rel="stylesheet" href="/expression-lab.css" />
  </head>
  <body>
    <main class="lab-shell">
      <header class="lab-header">
        <a class="back-link" href="/">返回观测终端</a>
        <p class="kicker">CHARACTER ASSET STUDY · 98001000</p>
        <h1>玛修的表情，不交给 AI 猜。</h1>
        <p class="intro">从图集中挑选一个实际存在的表情，为它附上稳定名称。游戏运行时只查本地表，不增加任何模型调用。</p>
      </header>

      <section class="stage" aria-label="表情预览">
        <div class="stage-copy">
          <p class="kicker">CURRENT EXPRESSION</p>
          <h2 id="expression-name">默认</h2>
          <p id="expression-description">沉静、正常的待机表情。</p>
          <div class="expression-code"><span>mash</span><code id="expression-key">neutral</code></div>
        </div>
        <div class="portrait-frame">
          <canvas id="portrait" width="512" height="480" aria-label="当前选中的玛修表情"></canvas>
          <span class="frame-caption">LIVE PREVIEW</span>
        </div>
      </section>

      <section class="catalogue" aria-labelledby="catalogue-title">
        <div class="catalogue-heading">
          <div><p class="kicker">EXPRESSION ATLAS</p><h2 id="catalogue-title">从图集选表情</h2></div>
          <p><strong id="tagged-count">0</strong> / 28 已标注</p>
        </div>
        <div id="expression-grid" class="expression-grid"></div>
      </section>
    </main>
    <template id="expression-card-template">
      <article class="expression-card">
        <button class="expression-preview" type="button"><canvas width="256" height="240"></canvas><span class="cell-index"></span></button>
        <label>表情标签<select class="expression-select"></select></label>
      </article>
    </template>
    <script type="module" src="/expression-lab.js"></script>
  </body>
</html>
